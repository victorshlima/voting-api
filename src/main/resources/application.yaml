server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: voting-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/votingdb
    username: secret
    password: secret
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1800000
      validation-timeout: 1000
      keepalive-time: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

voting-session:
  default-duration-minutes: 1
  max-duration-minutes: 60

voting-result:
  approval-threshold-percent: 50
  scheduler-interval: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,grafana
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.zaxxer.hikari: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN