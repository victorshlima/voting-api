spring:
  datasource:
    url: jdbc:h2:mem:votingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

  h2:
    console:
      enabled: true

voting-session:
  default-duration-minutes: 1
  max-duration-minutes: 60
